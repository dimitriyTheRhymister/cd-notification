# Profile
spring.profiles.active=develop
# Local server (mock)
server.port=9920
server.contextPath=/

# Logging
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.apache=ERROR
logging.level.ru.checkdev=DEBUG
logging.file.name=logs/notification.log
# Security
security.oauth2.resource.userInfoUri=http://localhost:9900/user
# Datasource
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/cd_notification
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Liquibase
spring.liquibase.change-log=classpath:db/db.changelog-master.xml
logging.level.liquibase=error
# Other
spring.main.banner-mode=off
access.key=96GcWB8a

#Eureka
spring.application.name = notification
eureka.client.fetch-registry = true
eureka.client.register-with-eureka = true
eureka.client.service-url.defaultZone = http://localhost:9009/eureka

# Resilience4j Retry
resilience4j.retry.instances.tgAuthRetry.maxAttempts=3
resilience4j.retry.instances.tgAuthRetry.waitDuration=500ms

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.tgAuthCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.tgAuthCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.tgAuthCircuitBreaker.waitDurationInOpenState=10000ms
resilience4j.circuitbreaker.instances.tgAuthCircuitBreaker.slidingWindowSize=100
resilience4j.circuitbreaker.instances.tgAuthCircuitBreaker.permittedNumberOfCallsInHalfOpenState=10

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,retries,circuitbreakerevents,retryevents
management.endpoint.health.show-details=always

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Consumer
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=ru.checkdev.notification.dto,ru.checkdev.notification.domain
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.lang.Object

# Kafka Producer (?? ???????, ??? ????????? ????????? ???????)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer